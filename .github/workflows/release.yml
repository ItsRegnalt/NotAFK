# Push a tag like v1.2.0 -> builds NotAFK on Windows and publishes NotAFK-1.2.0.zip as a GitHub Release.
# The app's updater (ui/updater.py) downloads that zip.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set version from tag
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          (Get-Content version.py) -replace '^VERSION = ".*"', "VERSION = `"$v`"" | Set-Content version.py -Encoding utf8
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: Build UI
        working-directory: v2
        run: |
          npm ci
          npm run build

      - name: Build EXE
        run: |
          pip install -r requirements.txt
          pyinstaller -y --clean Automate.spec

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/NotAFK -DestinationPath "NotAFK-$env:VERSION.zip"

      - uses: softprops/action-gh-release@v2
        with:
          files: NotAFK-${{ env.VERSION }}.zip
          generate_release_notes: true
